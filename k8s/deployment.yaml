apiVersion: apps/v1
kind: Deployment
metadata:
  name: industry-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: industry-app
  template:
    metadata:
      labels:
        app: industry-app
    spec:
      containers:
      - name: industry-app
        image: learnshrayank/enterprise-devops-app:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
